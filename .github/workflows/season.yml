# Redraws the "season so far" chart from your contribution calendar every day
# and saves it to the "output" branch. The README shows the files from there.
name: Season chart

on:
  schedule:
    - cron: "17 0 * * *" # every day, 00:17 UTC
  workflow_dispatch: # run it by hand from the Actions tab
  push:
    branches:
      - main

jobs:
  draw:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the season chart
        run: python scripts/season.py --user "${{ github.repository_owner }}" --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
