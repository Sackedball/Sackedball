<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="418" viewBox="0 0 1200 418" role="img" aria-labelledby="t d"><title id="t">Setup sheet: Soham&#x27;s stack</title><desc id="d">Data: Python, pandas, NumPy, scikit-learn, FastF1, FastAPI, Jupyter, Matplotlib. Web: TypeScript, React, Vite, Tailwind, Node.js, PixiJS. Android: Kotlin, Jetpack Compose, Android Studio.</desc><style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.sh-fill{transform-box:fill-box;transform-origin:0 50%;animation:sh-run 7s cubic-bezier(.7,0,.2,1) infinite}
@keyframes sh-run{0%{transform:scaleX(0);fill:#E0321A}45%{transform:scaleX(1);fill:#E0321A}
55%{fill:#1A7F37}88%{transform:scaleX(1);opacity:1;fill:#1A7F37}100%{transform:scaleX(1);opacity:0;fill:#1A7F37}}
.sh-in{animation:sh-in .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes sh-in{from{opacity:0;transform:translateX(-14px)}}

.row{animation:row .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes row{from{opacity:0;transform:translateY(10px)}}
.chk{animation:chk 9s linear infinite both}
@keyframes chk{0%{fill-opacity:0}3%{fill-opacity:1}90%{fill-opacity:1}100%{fill-opacity:0}}
.scan{animation:scan 9s linear infinite}
@keyframes scan{0%{transform:translateY(0);opacity:0}4%{opacity:1}85%{opacity:1}100%{transform:translateY(240px);opacity:0}}
